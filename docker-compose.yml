services:
  pm-agent:
    build:
      context: .
      dockerfile: pm-agent.Dockerfile
    container_name: pm-agent
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - claude-auth:/home/agent/.claude
      - ${HOST_SSH_PATH:-/root/.ssh}:/home/agent/.ssh:ro
    networks:
      - pm-agent-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  token-refresh:
    build: ./token-refresh
    container_name: token-refresh
    restart: unless-stopped
    volumes:
      - claude-auth:/root/.claude
    networks:
      - pm-agent-net
    healthcheck:
      test: ["CMD", "pgrep", "-f", "/usr/local/bin/refresh.sh"]
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  pm-agent-net:
    name: pm-agent-net
    driver: bridge

volumes:
  claude-auth:
